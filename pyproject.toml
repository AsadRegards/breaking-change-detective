[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breaking-change-detective"
version = "0.1.0"
description = "Detect API-contract breakage across a git repository using static analysis and LLM reasoning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
bcd = "scripts.cli:main"

[tool.setuptools.packages.find]
include = ["scripts*"]
